name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_catalog.py --check
      - run: python scripts/validate.py --manifest
      - run: python harnesses/actuals-review/run.py
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py --manifest
      - run: python scripts/test.py
      - run: python harnesses/actuals-review/run.py
      - run: python -m unittest discover -s harnesses/debt-liquidity -p "test_*.py"
      - run: python -m unittest discover -s harnesses/credit-review -p "test_*.py"
