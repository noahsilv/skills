name: Validate skills
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_catalog.py --check
      - run: python scripts/validate.py --manifest
      - run: python scripts/test_harnesses.py
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py --manifest
      - run: python scripts/test.py
      - run: python scripts/test_downloads.py
      - run: python scripts/test_publication.py
      - name: Install LibreOffice Calc for the financing example
        run: |
          if ! command -v soffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-calc
          fi
      - run: python scripts/test_harnesses.py --with-calc --json
